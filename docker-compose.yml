version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/sampahku-backend:latest
    container_name: sampahku-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - sampahku-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/sampahku-frontend:latest
    container_name: sampahku-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - sampahku-net

  nginx:
    image: nginx:alpine
    container_name: sampahku-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sampahku-net

networks:
  sampahku-net:
    driver: bridge